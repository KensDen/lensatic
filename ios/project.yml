# The source of ios/Lensatic.xcodeproj (session 8). Generate with XcodeGen from this folder: xcodegen generate
# The battery regenerates the project into .tmp/ and diffs it, so edit this file, never the project.
name: Lensatic
options:
  bundleIdPrefix: io.github.kensden
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # no intermediate groups: the files outside ios/ keep plain relative paths, so the project never takes the name of
  # the folder the repository is checked out in
  createIntermediateGroups: false
  # Xcode 27's "Update to recommended settings" (R5, nits v0.5 item 13), applied here because the project is generated:
  # the upgrade check is marked done for Xcode 27.1 (LastUpgradeCheck 2710), and the settings below are the ones its
  # upgrade tasks set
  xcodeVersion: "27.1"
# the project attribute behind "Build independent targets in parallel" (Xcode 27's upgrade task for command-line builds)
attributes:
  BuildIndependentTargetsInParallel: YES
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    # Xcode 27's recommended settings (R5, item 13): user script sandboxing, generated asset and string symbols, App
    # Groups registered from the entitlements, string catalogs preferred, and the C and C++ dialects its templates use
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # SwiftUI's symbols only: the views read the colours through SwiftUI, and UIKit's own UIColor.link would clash with the
    # link token's generated symbol
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_FRAMEWORKS: SwiftUI
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    REGISTER_APP_GROUPS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K57ZDM4BRY
    # Simulator builds are not bundle-signed (the linker still signs every binary). The repository sits in a folder
    # iCloud Drive syncs, which tags each built bundle with Finder information that codesign refuses; device builds
    # and archives sign as usual.
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
targets:
  Lensatic:
    type: application
    platform: iOS
    sources:
      - path: Lensatic
      # the content and the maker's photo by reference: the single source of each stays outside ios/
      - path: ../content/stack.json
        buildPhase: resources
      - path: ../web/src/about-photo.jpg
        buildPhase: resources
      # the Library (R2): the guide and the plays as tools/build_library.py generates them into each section's own tree,
      # and the umbrella's names for the sections, all by reference
      - path: ../guides/zero-trust/app/guide.json
        buildPhase: resources
      - path: ../playbook/app/plays.json
        buildPhase: resources
      # the playbook's figures (R3), the folder tools/build_figures.mjs renders into, by reference
      - path: ../playbook/app/figures
        type: folder
        buildPhase: resources
      - path: ../hub/site.json
        buildPhase: resources
      # What Changed (R3): the list tools/build_changes.py generates from the content history, by reference
      - path: ../content/changes.json
        buildPhase: resources
    dependencies:
      # the home screen widget (R3), embedded in the app
      - target: LensaticWidget
    # the App Group the app shares with its widget (R3): the progress file lives in its container
    entitlements:
      path: Lensatic/Lensatic.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.kensden.lensatic
    info:
      path: Lensatic/Info.plist
      properties:
        CFBundleDisplayName: Lensatic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexSans-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-Bold.ttf
        # the maker line in About, as the web build's --author gives it
        LensaticMaker: Ken Connell
        # the app's own links (R3): the widget's taps and the open intents; they move around the app and fetch nothing
        CFBundleURLTypes:
          - CFBundleURLName: io.github.kensden.lensatic
            CFBundleURLSchemes:
              - lensatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kensden.lensatic
        # simulator builds are not bundle-signed (above), so the linker carries the App Group entitlement in the
        # binary's own section, which is where the simulator reads it; device builds sign it as usual
        OTHER_LDFLAGS[sdk=iphonesimulator*]: -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker $(SRCROOT)/Lensatic/Lensatic.entitlements
        # one executable, so the section above is in the binary the simulator reads (no separate debug dylib)
        ENABLE_DEBUG_DYLIB: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  # the home screen widget (R3, Widget.dc.html): the next deadline and the next step, from the progress file in the App
  # Group's container and the content bundled with it; the model and the design tokens are the app's own files
  LensaticWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LensaticWidget
      - path: Lensatic/Model
        excludes:
          - AppModel.swift
      - path: Lensatic/Views/Theme.swift
      - path: Lensatic/Views/Design/Icons.swift
      - path: Lensatic/Resources/Fonts/IBMPlexSans-Regular.ttf
        buildPhase: resources
      - path: Lensatic/Resources/Fonts/IBMPlexSans-SemiBold.ttf
        buildPhase: resources
      - path: Lensatic/Resources/Fonts/IBMPlexSans-Bold.ttf
        buildPhase: resources
      - path: Lensatic/Resources/Fonts/IBMPlexMono-Medium.ttf
        buildPhase: resources
      - path: Lensatic/Resources/Assets.xcassets
      - path: ../content/stack.json
        buildPhase: resources
    entitlements:
      path: LensaticWidget/LensaticWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.kensden.lensatic
    info:
      path: LensaticWidget/Info.plist
      properties:
        CFBundleDisplayName: Lensatic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexSans-Bold.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kensden.lensatic.widget
        OTHER_LDFLAGS[sdk=iphonesimulator*]: -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker $(SRCROOT)/LensaticWidget/LensaticWidget.entitlements
        # one executable, so the section above is in the binary the simulator reads (no separate debug dylib)
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  LensaticTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LensaticTests
      # the repository's files at build time, by reference, so the tests never read outside their bundle
      - path: ../content/stack.json
        buildPhase: resources
      - path: ../tools/validate.py
        buildPhase: resources
    dependencies:
      - target: Lensatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kensden.lensatic.tests
        GENERATE_INFOPLIST_FILE: YES
        # no debug information in the test bundles: symbolicating a failure otherwise reads build files from the
        # iCloud Desktop, which the simulator waits on, and a failing test hangs instead of failing
        GCC_GENERATE_DEBUGGING_SYMBOLS: NO
  LensaticUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LensaticUITests
      - path: ../content/stack.json
        buildPhase: resources
    dependencies:
      - target: Lensatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kensden.lensatic.uitests
        GENERATE_INFOPLIST_FILE: YES
        GCC_GENERATE_DEBUGGING_SYMBOLS: NO
        TEST_TARGET_NAME: Lensatic
schemes:
  Lensatic:
    build:
      targets:
        Lensatic: all
    test:
      config: Debug
      targets:
        - LensaticTests
        - LensaticUITests
  # the accessibility sweep, a diagnostic that reads every section top to bottom and fails nothing (LensaticUITests)
  LensaticAuditSweep:
    build:
      targets:
        Lensatic: all
    test:
      config: Debug
      targets:
        - LensaticUITests
      environmentVariables:
        LENSATIC_AUDIT_SWEEP: "1"
